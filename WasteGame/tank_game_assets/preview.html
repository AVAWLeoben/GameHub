<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tank rig preview</title>
<style>
body{margin:0;background:#1f1f38;color:#eee;font:14px system-ui,sans-serif}
#stage{position:relative;overflow:hidden;background:linear-gradient(#34345c,#262642);width:100%}
#world{position:absolute;left:0;top:0;transform-origin:0 0;width:480px;height:200px}
#ground{position:absolute;left:0;right:0;bottom:0;height:34px;background:#0d1a0b}
.node{position:absolute;width:0;height:0}
.fx{position:absolute;pointer-events:none}
#ui{padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:flex;flex-direction:column;font-size:12px;color:#aab}
select,input[type=range],button{font-size:14px;margin-top:3px}
button{padding:8px;border:0;border-radius:6px;background:#ff8a1f;font-weight:700}
</style></head><body>
<div id="stage"><div id="world"><div id="ground"></div><div id="tank" class="node"></div></div></div>
<div id="ui">
<label>Tank<select id="tank_sel"></select></label>
<label>Colour<select id="color_sel"></select></label>
<label>Weapon<select id="weapon_sel"></select></label>
<label>Aim <span id="aim_v"></span><input id="aim" type="range"></label>
<label>Hull tilt <span id="tilt_v"></span><input id="tilt" type="range" min="-30" max="30" value="0"></label>
<label><span>Drive (wheels spin)</span><input id="drive" type="checkbox"></label>
<label><span>Face left</span><input id="flip" type="checkbox"></label>
<button id="fire">FIRE</button>

    "debris": {
      "sprites": [
        "png/fx/debris_0.png",
        "png/fx/debris_1.png",
        "png/fx/debris_2.png",
        "png/fx/debris_3.png"
      ],
      "logicalSize": [
        14,
        14
      ],
      "pivot": [
        7,
        7
      ]
    }
  }
};
const $ = id => document.getElementById(id);
const WW = 480, WH = 200;
let S = 1, nodeEls = {}, st = {tank:'scout', color:'green', weapon:'cannon', aim:-30, tilt:0, spin:0, recoil:0, flip:false};

function fit(){ const w = $('stage').clientWidth; S = w / WW; $('world').style.transform = `scale(${S})`; $('stage').style.height = (WH*S)+'px'; }
function opt(sel, items){ sel.innerHTML = items.map(i=>`<option>${i}</option>`).join(''); }
opt($('tank_sel'), Object.keys(RIG.tanks)); opt($('color_sel'), RIG.tanks.scout.colors); opt($('weapon_sel'), Object.keys(RIG.weapons));

function range(){
  const slot = RIG.tanks[st.tank].nodes.find(n=>n.id==='weapon_slot').joint.rotation, w = RIG.weapons[st.weapon].aimRange;
  return [Math.max(slot.min, w[0]), Math.min(slot.max, w[1])];
}
function build(){
  const tank = RIG.tanks[st.tank], w = RIG.weapons[st.weapon];
  const root = $('tank'); root.innerHTML = ''; nodeEls = {hull: null};
  const ground = tank.groundContacts[0][1];
  root.style.left = '170px'; root.style.top = (WH - 34 + 4 - ground) + 'px';
  const nodes = tank.nodes.map(n=>({...n}));
  nodes.push({id:'weapon', parent:'weapon_slot', position:[0,0], z:0, sprite:w.sprite, size:w.size, pivot:w.pivot});
  nodes.forEach(n=>{
    const d = document.createElement('div'); d.className='node';
    d.style.left = n.position[0]+'px'; d.style.top = n.position[1]+'px'; d.style.zIndex = n.z;
    if(n.sprite){
      const im = new Image(); im.src = n.sprite.replace('{color}', st.color); im.draggable = false;
      im.style.cssText = `position:absolute;z-index:0;width:${n.size[0]}px;height:${n.size[1]}px;left:${-n.pivot[0]}px;top:${-n.pivot[1]}px`;
      d.appendChild(im);
    }
    if(n.id==='weapon'){ const m = document.createElement('div'); m.className='node'; m.id='muzzle';
      m.style.left=(w.muzzle[0]-w.pivot[0])+'px'; m.style.top=(w.muzzle[1]-w.pivot[1])+'px'; d.appendChild(m); }
    (n.parent ? nodeEls[n.parent] : root).appendChild(d); nodeEls[n.id] = d;
  });
  const [lo, hi] = range(); const a = $('aim'); a.min = lo; a.max = hi;
  st.aim = Math.min(hi, Math.max(lo, st.aim)); a.value = st.aim;
  const tl = tank.nodes[0].joint.rotation; $('tilt').min = tl.min; $('tilt').max = tl.max;
  pose();
}
function pose(){
  nodeEls.hull.style.transform = `rotate(${st.tilt}deg)`;
  nodeEls.weapon_slot.style.transform = `rotate(${st.aim}deg)`;
  nodeEls.weapon.style.transform = `translate(${-st.recoil}px,0)`;
  Object.keys(nodeEls).filter(k=>k.startsWith('wheel')).forEach(k=>nodeEls[k].style.transform = `rotate(${st.spin}deg)`);
  $('tank').style.transform = st.flip ? 'scaleX(-1)' : '';
  $('aim_v').textContent = Math.round(st.aim)+'°'; $('tilt_v').textContent = Math.round(st.tilt)+'°';
}
function spawn(src, w, h, px, py, x, y){
  const i = new Image(); i.src = src; i.className='fx';
  i.style.cssText = `width:${w}px;height:${h}px;left:${x-px}px;top:${y-py}px`; $('world').appendChild(i); return i;
}
function fire(){
  const w = RIG.weapons[st.weapon], p = RIG.projectiles[w.projectile];
  const sr = $('stage').getBoundingClientRect(), mr = $('muzzle').getBoundingClientRect();
  let x = (mr.left - sr.left)/S, y = (mr.top - sr.top)/S;
  const dir = st.flip ? -1 : 1, ang = (st.tilt + st.aim) * Math.PI/180;
  let vx = Math.cos(ang)*dir*330, vy = Math.sin(ang)*330;
  const dist = w.recoil.distance, t0 = performance.now();
  (function rc(now){ const k = Math.min(1,(now-t0)/w.recoil.returnMs);
    st.recoil = dist * (k<0.15 ? k/0.15 : 1-(k-0.15)/0.85); pose(); if(k<1) requestAnimationFrame(rc); else {st.recoil=0; pose();} })(t0);
  const mf = spawn('png/fx/muzzle_flash_1.png', 48, 40, 4, 20, x, y);
  mf.style.transformOrigin='4px 20px'; mf.style.transform=`rotate(${(st.tilt+st.aim)*dir}deg) scaleX(${dir})`; setTimeout(()=>mf.remove(), 70);
  const pr = spawn(p.sprite, p.size[0], p.size[1], p.pivot[0], p.pivot[1], 0, 0); let last = performance.now();
  (function step(now){
    const dt = Math.min(0.05,(now-last)/1000); last = now; vy += 380*dt; x += vx*dt; y += vy*dt;
    pr.style.left=(x-p.pivot[0])+'px'; pr.style.top=(y-p.pivot[1])+'px';
    pr.style.transform=`rotate(${Math.atan2(vy,vx)}rad)`;
    if(y > WH-34 || x<-20 || x>WW+20){ pr.remove(); boom(x, Math.min(y, WH-34)); return; }
    requestAnimationFrame(step); })(last);
}
function boom(x, y){
  let i = 0; const e = spawn('png/fx/explosion_0.png', 128, 128, 64, 64, x, y);
  const iv = setInterval(()=>{ i++; if(i>7){ clearInterval(iv); e.remove(); return; } e.src = `png/fx/explosion_${i}.png`; }, 1000/RIG.fx.explosion_sheet.fps);
}
$('tank_sel').onchange = e => { st.tank = e.target.value; build(); };
$('color_sel').onchange = e => { st.color = e.target.value; build(); };
$('weapon_sel').onchange = e => { st.weapon = e.target.value; build(); };
$('aim').oninput = e => { st.aim = +e.target.value; pose(); };
$('tilt').oninput = e => { st.tilt = +e.target.value; pose(); };
$('flip').onchange = e => { st.flip = e.target.checked; pose(); };
$('fire').onclick = fire;
(function loop(){ if($('drive').checked){ st.spin = (st.spin + 6) % 360; pose(); } requestAnimationFrame(loop); })();
addEventListener('resize', fit); fit(); build();
</script></body></html>
